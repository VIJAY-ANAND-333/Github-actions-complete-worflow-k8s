apiVersion: apps/v1
kind: Deployment
metadata:
  name: vj-app
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vj-app
  template:
    metadata:
      labels:
        app: vj-app
    spec:
      containers:
        - name: vj-app
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
          env:
            - name: NODE_ENV
              value: dev
